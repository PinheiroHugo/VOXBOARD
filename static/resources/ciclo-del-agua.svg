<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo del agua</title><desc id="desc">El Sol calienta el agua. El agua se evapora, se condensa en nubes, cae como precipitación y se acumula en ríos y lagos.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sistema solar</title>
  <desc id="desc">El Sol y los ocho planetas en orden: Mercurio, Venus, Tierra, Marte, Júpiter, Saturno, Urano y Neptuno. Esquema sin escala.</desc>
  <rect width="1200" height="620" rx="20" fill="#102b45"/>
  <g fill="#fff" opacity=".5"><circle cx="200" cy="90" r="3"/><circle cx="400" cy="160" r="3"/><circle cx="620" cy="70" r="3"/><circle cx="850" cy="120" r="3"/><circle cx="1040" cy="70" r="3"/><circle cx="1100" cy="460" r="3"/><circle cx="560" cy="490" r="3"/></g>
  <path d="M90 310H1130" stroke="#7794ae" stroke-width="2" stroke-dasharray="8 10"/>
  <g><circle cx="90" cy="310" r="72" fill="#ffc94b"/><circle cx="230" cy="310" r="15" fill="#b9b2a7"/><circle cx="340" cy="310" r="25" fill="#e5b66f"/><circle cx="450" cy="310" r="27" fill="#439ddd"/><path d="M435 292l20 6 8 15-20 13-13-16z" fill="#5cbe83"/><circle cx="560" cy="310" r="21" fill="#dd7357"/><circle cx="700" cy="310" r="57" fill="#dbb08c"/><path d="M650 288h100M645 312h110M655 335h90" stroke="#b97759" stroke-width="9"/><circle cx="860" cy="310" r="43" fill="#e5c986"/><ellipse cx="860" cy="310" rx="75" ry="16" fill="none" stroke="#bca981" stroke-width="10" transform="rotate(-23 860 310)"/><circle cx="1000" cy="310" r="31" fill="#86d1d8"/><circle cx="1120" cy="310" r="30" fill="#527ce7"/></g>
  <g fill="white" font-family="Segoe UI, sans-serif" font-size="25" text-anchor="middle"><text x="90" y="430">Sol</text><text x="230" y="240">Mercurio</text><text x="340" y="430">Venus</text><text x="450" y="240">Tierra</text><text x="560" y="430">Marte</text><text x="700" y="210">Júpiter</text><text x="860" y="430">Saturno</text><text x="1000" y="240">Urano</text><text x="1120" y="430">Neptuno</text><text x="600" y="555" font-size="27" fill="#d2e4f5">Los planetas giran alrededor del Sol.</text><text x="600" y="590" font-size="21" fill="#d2e4f5">Esquema: tamaños y distancias sin escala.</text></g>
</svg>

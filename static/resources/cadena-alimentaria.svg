<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Cadena alimentaria</title><desc id="desc">La hierba recibe energía del Sol. El saltamontes come hierba, la rana come al saltamontes y la serpiente come a la rana. Las flechas indican hacia dónde pasa la energía.</desc>
